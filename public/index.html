<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>exec-crm</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand"><span class="mark">e</span><span class="word">exec-crm</span></div>
    <nav class="nav" id="nav">
      <a href="#/dashboard" data-r="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>Dashboard</a>
      <a href="#/outreach" data-r="outreach"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>Outreach</a>
      <a href="#/campaigns" data-r="campaigns"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>Campaigns</a>
      <a href="#/workshop" data-r="workshop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>Data Workshop</a>
    </nav>
    <div class="side-foot"><kbd>⌘K</kbd> quick find</div>
  </aside>
  <div class="main">
    <div class="topbar">
      <h1 id="page-title">Dashboard</h1>
      <div class="spacer"></div>
      <div class="ws-wrap">
        <button class="ws-btn" id="ws-btn" aria-haspopup="true" title="Switch workspace">
          <span class="ws-dot" id="ws-dot"></span><span id="ws-name"></span><span class="ws-caret">▾</span>
        </button>
        <div class="ws-menu" id="ws-menu" hidden></div>
      </div>
      <button class="cmdk" id="cmdk-btn" title="Quick find">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <span>Search deals, people…</span><kbd>⌘K</kbd>
      </button>
      <div class="date" id="today"></div>
    </div>
    <div class="view" id="view"></div>
  </div>
</div>
<!-- Milton dock: floating, collapsible chat, wired up by initMiltonDock() -->
<div id="milton-dock" class="milton-dock" aria-label="Milton chat">
  <div class="milton-dock-head" id="milton-dock-head" role="button" tabindex="0"
       aria-expanded="false" aria-controls="milton-dock-body" title="Open Milton chat">
    <span class="mdot" id="milton-dock-dot"></span>
    <b>Milton</b>
    <span class="md-status" id="milton-dock-status">starting…</span>
    <span class="spacer"></span>
    <span class="md-chev" aria-hidden="true">▴</span>
  </div>
  <div class="milton-dock-body" id="milton-dock-body" hidden>
    <div class="milton-dock-tools">
      <span class="md-note">scoped to this workspace</span>
      <span class="spacer"></span>
      <button class="btn ghost sm" id="milton-dock-new">New conversation</button>
    </div>
    <div class="milton-msgs" id="milton-msgs" aria-live="polite"></div>
    <div class="milton-chips" id="milton-chips"></div>
    <form class="milton-input" id="milton-form">
      <input id="milton-text" placeholder="Ask Milton — try “morning brief” or “pipeline hygiene”" autocomplete="off">
      <button class="btn" type="submit">Send</button>
    </form>
  </div>
</div>
<div id="modal-root"></div>
<div id="palette-root"></div>
<script src="/app.js"></script>
</body>
</html>
